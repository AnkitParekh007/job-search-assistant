<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("ajs-theme");
          document.documentElement.setAttribute(
            "data-theme",
            t === "light" ? "light" : "dark"
          );
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
        document.documentElement.classList.add("reveal-ready");
      })();
    </script>
    <!--seo-->
    <title>Job Search Assistant — Local-first macOS job search command center</title>
    <meta
      name="description"
      content="Local-first macOS desktop app. Discover roles, prepare applications, and track them on files you own. The published package is Apple Silicon, ad-hoc signed, and not notarized. You submit applications yourself."
    />
    <link rel="canonical" href="https://job-search-assistant.rebound-ops.org/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Job Search Assistant" />
    <meta
      property="og:description"
      content="Local-first macOS job search workspace. Apple Silicon download is ad-hoc signed and not notarized. You submit applications yourself."
    />
    <meta property="og:url" content="https://job-search-assistant.rebound-ops.org/" />
    <meta
      property="og:image"
      content="https://job-search-assistant.rebound-ops.org/assets/img/og-social.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Job Search Assistant" />
    <meta
      name="twitter:description"
      content="Local-first macOS job search workspace. Ad-hoc signed, not notarized. You submit applications yourself."
    />
    <meta
      name="twitter:image"
      content="https://job-search-assistant.rebound-ops.org/assets/img/og-social.png"

    <meta name="theme-color" content="#070814" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
