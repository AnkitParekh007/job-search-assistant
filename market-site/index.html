<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("ajs-theme");
          document.documentElement.setAttribute(
            "data-theme",
            t === "dark" ? "dark" : "light"
          );
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
        document.documentElement.classList.add("reveal-ready");
      })();
    </script>
    <!--seo-->
    <title>AI Job Search — Local-first macOS job search command center</title>
    <meta
      name="description"
      content="Local-first macOS desktop app with multi-provider AI support (Claude Code or OpenAI Codex) for your ai-job-search workspace — discover, rank, prepare applications, and track outcomes on files you own."
    />
    <link rel="canonical" href="https://ankitparekh007.github.io/job-search-assistant/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AI Job Search" />
    <meta
      property="og:description"
      content="Local-first macOS job search command center with multi-provider AI support and workspace files you own."
    />
    <meta property="og:url" content="https://ankitparekh007.github.io/job-search-assistant/" />
    <meta
      property="og:image"
      content="https://ankitparekh007.github.io/job-search-assistant/assets/img/og-social.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AI Job Search" />

      name="twitter:image"

    <link rel="preconnect" href="https://api.fontshare.com" />
