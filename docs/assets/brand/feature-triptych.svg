<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="410" viewBox="0 0 1440 410" role="img" aria-label="Three conceptual feature illustrations: discover promising jobs, prepare truthful application documents, and track application outcomes">
<defs>
  <linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#11182F"/><stop offset="100%" stop-color="#1C1A3B"/></linearGradient>
  <linearGradient id="one" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#8D83FE"/><stop offset="100%" stop-color="#6273F4"/></linearGradient>
  <linearGradient id="two" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7DE2CF"/><stop offset="100%" stop-color="#42AFC8"/></linearGradient>
