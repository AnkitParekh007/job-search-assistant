<text x="520" y="65" font-size="14" font-weight="700" letter-spacing="2" fill="#7FE3D0">02 / PREPARE</text>
<text x="520" y="103" font-size="29" font-weight="800" fill="#FCFCFF">Make every draft count.</text>
<text x="520" y="129" font-size="15" fill="#ADB8D6">Tailor, inspect and approve before using.</text>
