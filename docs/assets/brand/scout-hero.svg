<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-label="AI Job Search Assistant  Scout mascot hero">
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f5fb"/>
      <stop offset="55%" stop-color="#ebeff8"/>
      <stop offset="100%" stop-color="#e4eaf4"/>
    </linearGradient>
    <linearGradient id="panelGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f3f4f8"/>
    </linearGradient>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#1a1a2e" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1280" height="480" fill="url(#heroBg)"/>
  <circle cx="1080" cy="-40" r="220" fill="#6d5ef0" opacity="0.08"/>
  <circle cx="200" cy="520" r="180" fill="#0f9a88" opacity="0.07"/>

  <!-- Scout mark (matches onboarding mascot geometry) -->
  <g transform="translate(96, 118)">
    <rect x="8" y="24" width="112" height="96" rx="36" fill="#6d5ef0"/>
    <rect x="20" y="36" width="88" height="72" rx="26" fill="#ffffff"/>
    <circle cx="64" cy="16" r="7" fill="#0f9a88"/>
    <rect x="62" y="18" width="4" height="10" fill="#6d5ef0"/>
    <ellipse cx="48" cy="66" rx="6.4" ry="8.4" fill="#17171c"/>
    <ellipse cx="80" cy="66" rx="6.4" ry="8.4" fill="#17171c"/>
    <path d="M50 86 q14 12 28 0" stroke="#5b5b66" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Title block -->
  <text x="248" y="178" fill="#17171c" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="700">AI Job Search Assistant</text>
  <text x="248" y="228" fill="#5b5b66" font-family="Helvetica, Arial, sans-serif" font-size="22">Your AI job-search workflows. One visual desktop workspace.</text>
  <text x="248" y="268" fill="#8b8b96" font-family="Helvetica, Arial, sans-serif" font-size="16">Local-first · Open source · macOS · Human approvals</text>

  <!-- CTA chips (visual only) -->
  <g transform="translate(248, 300)">
    <rect width="168" height="40" rx="12" fill="#6d5ef0"/>
    <text x="84" y="26" text-anchor="middle" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600">Build from source</text>
    <rect x="180" y="0" width="132" height="40" rx="12" fill="#ffffff" stroke="#d4d4dc"/>
    <text x="246" y="26" text-anchor="middle" fill="#17171c" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600">Explore docs</text>
  </g>

  <!-- Desktop shell illustration -->
  <g transform="translate(700, 72)" filter="url(#softShadow)">
    <rect width="500" height="336" rx="20" fill="#0f0f12"/>
    <rect x="14" y="14" width="112" height="308" rx="12" fill="#0b0b0d"/>
    <rect x="28" y="36" width="84" height="10" rx="5" fill="#6d5ef0" opacity="0.9"/>
    <rect x="28" y="60" width="70" height="8" rx="4" fill="#2a2a32"/>
    <rect x="28" y="80" width="64" height="8" rx="4" fill="#2a2a32"/>
    <rect x="28" y="100" width="76" height="8" rx="4" fill="#2a2a32"/>
    <rect x="28" y="120" width="58" height="8" rx="4" fill="#2a2a32"/>
    <rect x="140" y="14" width="346" height="308" rx="12" fill="url(#panelGlow)"/>
    <text x="160" y="48" fill="#17171c" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700">Today</text>
    <rect x="160" y="66" width="140" height="72" rx="12" fill="#efedff"/>
    <rect x="316" y="66" width="140" height="72" rx="12" fill="#e1f5f2"/>
    <rect x="160" y="154" width="296" height="48" rx="12" fill="#f3f3f6"/>
    <rect x="160" y="218" width="180" height="80" rx="12" fill="#ffffff" stroke="#e6e6eb"/>
    <rect x="356" y="218" width="100" height="80" rx="12" fill="#ffffff" stroke="#e6e6eb"/>
    <rect x="172" y="236" width="100" height="8" rx="4" fill="#d4d4dc"/>
    <rect x="172" y="254" width="72" height="8" rx="4" fill="#e6e6eb"/>
  </g>
</svg>
