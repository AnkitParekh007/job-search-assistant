<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="680" viewBox="0 0 1440 680" role="img" aria-label="Concept illustration for Job Search Assistant: an illustrated desktop command center with Scout the bot, discovery, drafting and review panels">
<defs>
  <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#090F22"/><stop offset="55%" stop-color="#141B39"/><stop offset="100%" stop-color="#241645"/></linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#A99BFF"/><stop offset="100%" stop-color="#7366F2"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#77E4F7"/><stop offset="100%" stop-color="#58AEFF"/></linearGradient>
  <linearGradient id="window" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#222C4B"/><stop offset="100%" stop-color="#161E36"/></linearGradient>
  <pattern id="mesh" width="52" height="52" patternUnits="userSpaceOnUse"><path d="M52 0 H0 V52" fill="none" stroke="#A6B6EB" stroke-opacity=".075" stroke-width="1"/></pattern>
  <filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="70"/></filter>
  <filter id="drop" x="-30%" y="-30%" width="170%" height="180%"><feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#020512" flood-opacity=".48"/></filter>
</defs>
<rect width="1440" height="680" fill="url(#night)"/><rect width="1440" height="680" fill="url(#mesh)"/>
<circle cx="1200" cy="65" r="310" fill="#7B61FF" opacity=".21" filter="url(#glow)"/>
<circle cx="415" cy="650" r="275" fill="#12BEDB" opacity=".13" filter="url(#glow)"/>
<circle cx="1415" cy="585" r="175" fill="#FB83BD" opacity=".13" filter="url(#glow)"/>
<path d="M0 610 C320 545 535 738 836 609 C1050 517 1255 558 1440 586" fill="none" stroke="#899BF8" stroke-opacity=".13" stroke-width="2"/>
<g font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif">
  <rect x="86" y="78" width="245" height="36" rx="18" fill="#A69AFC" fill-opacity=".12" stroke="#B8AFFB" stroke-opacity=".37"/>
  <circle cx="108" cy="96" r="5" fill="#86F0CB"/>
  <text x="124" y="101" font-size="13" font-weight="700" letter-spacing="2.2" fill="#DCD8FF">OPEN SOURCE · LOCAL FIRST</text>
  <text x="84" y="207" font-size="67" font-weight="800" letter-spacing="-2.9" fill="#FFFFFF">Less job-search</text>
  <text x="84" y="283" font-size="67" font-weight="800" letter-spacing="-2.9" fill="#A99BFF">tab chaos.</text>
  <path d="M86 300 Q287 330 475 297" fill="none" stroke="#6FD6F3" stroke-width="4" stroke-linecap="round" opacity=".78"/>
  <text x="86" y="356" font-size="26" font-weight="700" fill="#F4F5FF">More career momentum.</text>
  <text x="86" y="402" font-size="20" fill="#C4CEE9">Discover opportunities, prepare tailored</text>
  <text x="86" y="431" font-size="20" fill="#C4CEE9">applications, and track every next move.</text>
  <g font-size="14" font-weight="650">
    <rect x="86" y="473" width="140" height="38" rx="19" fill="#A99BFF" fill-opacity=".16" stroke="#A99BFF" stroke-opacity=".52"/>
    <text x="156" y="498" fill="#E5E0FF" text-anchor="middle">macOS desktop</text>
    <rect x="238" y="473" width="142" height="38" rx="19" fill="#7DE8D3" fill-opacity=".11" stroke="#7DE8D3" stroke-opacity=".43"/>
    <text x="309" y="498" fill="#C9FFF0" text-anchor="middle">Human approvals</text>
    <rect x="392" y="473" width="152" height="38" rx="19" fill="#7DDAFF" fill-opacity=".11" stroke="#7DDAFF" stroke-opacity=".40"/>
    <text x="468" y="498" fill="#D1F0FF" text-anchor="middle">Your local files</text>
  </g>
  <g transform="translate(89 544)">
    <rect x="5" y="14" width="75" height="65" rx="24" fill="url(#violet)"/>
    <rect x="13" y="22" width="59" height="49" rx="18" fill="#FEFCFF"/>
    <rect x="40" y="5" width="4" height="13" rx="2" fill="#AA9FFF"/>
    <circle cx="42" cy="6" r="5" fill="#82EAD6"/>
    <ellipse cx="31" cy="45" rx="3.5" ry="5.5" fill="#20223A"/>
    <ellipse cx="53" cy="45" rx="3.5" ry="5.5" fill="#20223A"/>
    <path d="M31 57 Q42 65 53 57" fill="none" stroke="#6F6B89" stroke-width="3" stroke-linecap="round"/>
    <path d="M13 79 L4 87 M72 79 L81 87" stroke="#A99BFF" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="190" y="580" font-size="16" font-weight="700" fill="#F3F0FF">Meet Scout</text>
  <text x="190" y="604" font-size="14" fill="#B7C4DF">Your friendly guide from setup to next steps.</text>
</g>
<!-- Conceptual desktop workbench -->
<g filter="url(#drop)">
  <rect x="665" y="84" width="706" height="516" rx="22" fill="#10182D" stroke="#7687CD" stroke-opacity=".42" stroke-width="2"/>
  <rect x="666" y="85" width="704" height="49" rx="21" fill="#26304E"/>
  <rect x="667" y="110" width="702" height="25" fill="#26304E"/>
  <circle cx="690" cy="110" r="6" fill="#FE818D"/><circle cx="712" cy="110" r="6" fill="#FFD078"/><circle cx="734" cy="110" r="6" fill="#72DBAD"/>
  <text x="1007" y="116" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#DBE2F7" text-anchor="middle">Job Search Assistant</text>
  <rect x="684" y="150" width="150" height="432" rx="14" fill="#161E35"/>
  <rect x="700" y="171" width="118" height="38" rx="10" fill="#7366F2" fill-opacity=".22"/>
  <circle cx="721" cy="190" r="7" fill="#AE9FFF"/>
  <text x="739" y="195" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#DED9FF">Today</text>
  <g font-family="Arial,sans-serif" font-size="14" fill="#9EACCC">
    <circle cx="722" cy="244" r="5" fill="#6E9FCF"/><text x="739" y="249">Jobs</text>
    <circle cx="722" cy="287" r="5" fill="#6E9FCF"/><text x="739" y="292">Studio</text>
    <circle cx="722" cy="330" r="5" fill="#6E9FCF"/><text x="739" y="335">Pipeline</text>
    <circle cx="722" cy="373" r="5" fill="#6E9FCF"/><text x="739" y="378">Activity</text>
  </g>
  <rect x="852" y="150" width="501" height="432" rx="14" fill="url(#window)"/>
  <text x="882" y="193" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#F6F7FF">Good morning, job hunter</text>
  <text x="882" y="220" font-family="Arial,sans-serif" font-size="14" fill="#AAB7D5">Your next moves, all in one place.</text>
  <rect x="882" y="241" width="211" height="108" rx="13" fill="#32335E"/>
  <rect x="1107" y="241" width="215" height="108" rx="13" fill="#214451"/>
  <text x="901" y="270" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#BFC2FF">DISCOVER</text>
  <text x="901" y="302" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#F7F6FF">Find your fit</text>
  <rect x="901" y="321" width="153" height="5" rx="2.5" fill="#8988E2" opacity=".8"/>
  <text x="1126" y="270" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#A5ECDC">PREPARE</text>
  <text x="1126" y="302" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#F3FFFC">Tailor &amp; review</text>
  <rect x="1126" y="321" width="151" height="5" rx="2.5" fill="#66C5B2" opacity=".8"/>
  <text x="882" y="389" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#F1F2FF">Your next actions</text>
  <rect x="882" y="406" width="440" height="63" rx="11" fill="#29334F"/>
  <circle cx="907" cy="437" r="11" fill="#8775F6"/>
  <path d="M902 437 l4 4 7 -9" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="928" y="434" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#E8EAFE">Review your latest shortlist</text>
  <text x="928" y="452" font-family="Arial,sans-serif" font-size="12" fill="#A9B5D1">Compare fit before preparing documents</text>
  <rect x="882" y="481" width="440" height="63" rx="11" fill="#29334F"/>
  <circle cx="907" cy="512" r="11" fill="#71D2C1"/>
  <path d="M902 512 l4 4 7 -9" fill="none" stroke="#193548" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="928" y="509" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#E8EAFE">Track what happens next</text>
  <text x="928" y="527" font-family="Arial,sans-serif" font-size="12" fill="#A9B5D1">Your pipeline remains under your control</text>
</g>
<rect x="1110" y="573" width="237" height="29" rx="14" fill="#0E172C" stroke="#8A96D5" stroke-opacity=".25"/>
<text x="1228" y="592" font-family="Arial,sans-serif" font-size="11" letter-spacing="1" fill="#AFBAD7" text-anchor="middle">CONCEPT ILLUSTRATION</text>
</svg>