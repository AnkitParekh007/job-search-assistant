<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="180" viewBox="0 0 1100 180" role="img" aria-label="Job search journey: Connect, Discover, Rank, Prepare, Review, Track">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8b8b96"/>
    </marker>
  </defs>
  <rect width="1100" height="180" rx="16" fill="#f7f7f8"/>

  <!-- Steps -->
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <g transform="translate(40, 42)">
      <rect width="140" height="96" rx="16" fill="#ffffff" stroke="#e6e6eb"/>
      <circle cx="70" cy="34" r="14" fill="#efedff"/>
      <text x="70" y="39" fill="#4b3dc9" font-size="12" font-weight="700">1</text>
      <text x="70" y="68" fill="#17171c" font-size="15" font-weight="700">Connect</text>
      <text x="70" y="88" fill="#8b8b96" font-size="11">workspace</text>
    </g>
    <g transform="translate(210, 42)">
      <rect width="140" height="96" rx="16" fill="#ffffff" stroke="#e6e6eb"/>
      <circle cx="70" cy="34" r="14" fill="#efedff"/>
      <text x="70" y="39" fill="#4b3dc9" font-size="12" font-weight="700">2</text>
      <text x="70" y="68" fill="#17171c" font-size="15" font-weight="700">Discover</text>
      <text x="70" y="88" fill="#8b8b96" font-size="11">opportunities</text>
    </g>
    <g transform="translate(380, 42)">
      <rect width="140" height="96" rx="16" fill="#ffffff" stroke="#e6e6eb"/>
      <circle cx="70" cy="34" r="14" fill="#efedff"/>
      <text x="70" y="39" fill="#4b3dc9" font-size="12" font-weight="700">3</text>
      <text x="70" y="68" fill="#17171c" font-size="15" font-weight="700">Rank</text>
      <text x="70" y="88" fill="#8b8b96" font-size="11">fit &amp; gaps</text>
    </g>
    <g transform="translate(550, 42)">
      <rect width="140" height="96" rx="16" fill="#ffffff" stroke="#e6e6eb"/>
      <circle cx="70" cy="34" r="14" fill="#efedff"/>
      <text x="70" y="39" fill="#4b3dc9" font-size="12" font-weight="700">4</text>
      <text x="70" y="68" fill="#17171c" font-size="15" font-weight="700">Prepare</text>
      <text x="70" y="88" fill="#8b8b96" font-size="11">CV &amp; letter</text>
    </g>
    <g transform="translate(720, 42)">
      <rect width="140" height="96" rx="16" fill="#ffffff" stroke="#e6e6eb"/>
      <circle cx="70" cy="34" r="14" fill="#e1f5f2"/>
      <text x="70" y="39" fill="#0f9a88" font-size="12" font-weight="700">5</text>
      <text x="70" y="68" fill="#17171c" font-size="15" font-weight="700">Review</text>
      <text x="70" y="88" fill="#8b8b96" font-size="11">you approve</text>
    </g>
    <g transform="translate(890, 42)">
      <rect width="140" height="96" rx="16" fill="#ffffff" stroke="#e6e6eb"/>
      <circle cx="70" cy="34" r="14" fill="#e4f4ea"/>
      <text x="70" y="39" fill="#1d8a52" font-size="12" font-weight="700">6</text>
      <text x="70" y="68" fill="#17171c" font-size="15" font-weight="700">Track</text>
      <text x="70" y="88" fill="#8b8b96" font-size="11">pipeline</text>
    </g>
  </g>

  <!-- Connectors -->
  <g stroke="#8b8b96" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="180" y1="90" x2="206" y2="90"/>
    <line x1="350" y1="90" x2="376" y2="90"/>
    <line x1="520" y1="90" x2="546" y2="90"/>
    <line x1="690" y1="90" x2="716" y2="90"/>
    <line x1="860" y1="90" x2="886" y2="90"/>
  </g>
</svg>
