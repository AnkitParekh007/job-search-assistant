name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "apps/**"
      - "packages/**"
      - "scripts/package-release-assets.sh"
      - "scripts/ci-package-release-assets.sh"
      - "scripts/publish-release-assets.sh"
      - "scripts/validate-macos-release.sh"
      - "scripts/sign-macos-*.sh"
      - "scripts/notarize-macos.sh"
      - "scripts/build-macos-apple-silicon-preview.sh"
      - ".github/workflows/release.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
    inputs:
      publish_assets:
        description: "Upload/replace GitHub Release assets (requires explicit approval)"
        type: boolean
        default: false
      platforms:
        description: "Comma platforms to require when publishing (native only)"
        type: string
        default: "macos-arm64"

permissions:
  contents: read

concurrency:
  group: release-assets
  cancel-in-progress: true

jobs:
  version:
    name: Resolve release version
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
      ship: ${{ steps.ver.outputs.ship }}
      publish: ${{ steps.ver.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve version and check the download page
        id: ver
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          INPUT_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_assets || false }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          else
            VERSION="$(node -p "require('./package.json').version")"
            TAG="v${VERSION}"
          fi
          export TAG VERSION
          python3 - <<'PY'
          import os, re, sys
          from pathlib import Path
          text = Path("market-site/src/lib/releases.ts").read_text()
          tag = re.search(r'RELEASE_TAG = "([^"]+)"', text)
          ver = re.search(r'RELEASE_VERSION = "([^"]+)"', text)
          if not tag or not ver:
              sys.exit("market-site/src/lib/releases.ts is missing RELEASE_TAG or RELEASE_VERSION")
          if tag.group(1) != os.environ["TAG"] or ver.group(1) != os.environ["VERSION"]:
              sys.exit(
                  f"Download page is {tag.group(1)} ({ver.group(1)}) but this release is "
                  f"{os.environ['TAG']} ({os.environ['VERSION']}). "
                  "Update market-site/src/lib/releases.ts in the same change."
              )
          PY

          SHIP=true
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_TYPE}" == "branch" ]]; then
            BEFORE="${EVENT_BEFORE:-}"
            if [[ -n "$BEFORE" && "$BEFORE" != "0000000000000000000000000000000000000000" ]]; then
              CHANGED="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"
              if ! CHANGED="$CHANGED" python3 - <<'PY'
          import os, sys
          SHIP_FILES = {
              "scripts/package-release-assets.sh",
              "scripts/ci-package-release-assets.sh",
              "scripts/publish-release-assets.sh",
              "scripts/validate-macos-release.sh",
              "scripts/build-macos-apple-silicon-preview.sh",
              ".github/workflows/release.yml",
              "package.json",
              "package-lock.json",
          }
          ship = False
          for path in os.environ.get("CHANGED", "").splitlines():
              path = path.strip()
              if not path or path.endswith(".md"):
                  continue
              if (
                  path.startswith("apps/")
                  or path.startswith("packages/")
                  or path.startswith("scripts/sign-macos-")
                  or path.startswith("scripts/notarize-")
                  or path in SHIP_FILES
              ):
                  ship = True
                  break
          sys.exit(0 if ship else 1)
          PY
              then
                SHIP=false
                echo "No shippable app code in this push; skipping native build."
              fi
            fi
          fi

          # Phase A: never auto-publish on push/tag. Only workflow_dispatch + publish_assets.
          PUBLISH=false
          if [[ "${INPUT_PUBLISH}" == "true" ]]; then
            PUBLISH=true
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ship=$SHIP" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Resolved $TAG ($VERSION) ship=$SHIP publish=$PUBLISH"

  macos-app:
    name: Build + validate macOS Apple Silicon
    needs: version
    if: needs.version.outputs.ship == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          rm -rf node_modules apps/*/node_modules packages/*/node_modules
          npm ci

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/macos-apple-silicon/src-tauri -> target

      - name: Build + ad-hoc sign + validate (developer preview)
        run: bash scripts/build-macos-apple-silicon-preview.sh

      - name: Package native Apple Silicon zip
        env:
          ONLY: macos-arm64
          REQUIRE_NATIVE: "1"
        run: bash scripts/package-release-assets.sh "${{ needs.version.outputs.version }}"

      - name: Upload Apple Silicon zip (Actions artifact only)
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: |
            dist-release/AI-Job-Search-*-macos-arm64.zip
            dist-release/SHA256SUMS.txt
          if-no-files-found: error

  # Gate C proxies — advisory compile only; never gate publish or treat as installers.
  macos-intel-check:
    name: cargo check macOS Intel tree (advisory)
    needs: version
    if: needs.version.outputs.ship == 'true'
    continue-on-error: true
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo check (macos-intel host)
        working-directory: apps/macos-intel/src-tauri
        continue-on-error: true
        run: cargo check --locked

  windows-check:
    name: cargo check Windows tree (advisory)
    needs: version
    if: needs.version.outputs.ship == 'true'
    continue-on-error: true
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo check (windows)
        working-directory: apps/windows/src-tauri
        continue-on-error: true
        run: cargo check --locked

  publish:
    name: Publish GitHub Release assets (manual approval only)
    needs: [version, macos-app]
    if: >-
      always()
      && !cancelled()
      && needs.version.result == 'success'
      && needs.macos-app.result == 'success'
      && needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Apple Silicon zip
        uses: actions/download-artifact@v4
        with:
          name: release-macos-arm64
          path: incoming

      - name: Publish native assets (approved)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_PUBLISH_APPROVED: "1"
          REQUIRE_PLATFORMS: ${{ inputs.platforms || 'macos-arm64' }}
        run: bash scripts/publish-release-assets.sh incoming
