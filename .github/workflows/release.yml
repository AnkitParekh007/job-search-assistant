name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
    # App / package / release-tooling only. README, docs, market-site, and campaign
    # changes do not match this list, so they never refresh download assets.
    paths:
      - "apps/**"
      - "packages/**"
      - "scripts/package-release-assets.sh"
      - "scripts/ci-package-release-assets.sh"
      - "scripts/publish-release-assets.sh"
      - ".github/workflows/release.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-assets
  cancel-in-progress: true

jobs:
  version:
    name: Resolve release version
    runs-on: ubuntu-latest
    # Manual runs publish only from main or a v* tag, so a branch dispatch cannot replace download assets.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
      ship: ${{ steps.ver.outputs.ship }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve version and check the download page
        id: ver
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          else
            VERSION="$(node -p "require('./package.json').version")"
            TAG="v${VERSION}"
          fi
          export TAG VERSION
          python3 - <<'PY'
          import os, re, sys
          from pathlib import Path
          text = Path("market-site/src/lib/releases.ts").read_text()
          tag = re.search(r'RELEASE_TAG = "([^"]+)"', text)
          ver = re.search(r'RELEASE_VERSION = "([^"]+)"', text)
          if not tag or not ver:
              sys.exit("market-site/src/lib/releases.ts is missing RELEASE_TAG or RELEASE_VERSION")
          if tag.group(1) != os.environ["TAG"] or ver.group(1) != os.environ["VERSION"]:
              sys.exit(
                  f"Download page is {tag.group(1)} ({ver.group(1)}) but this release is "
                  f"{os.environ['TAG']} ({os.environ['VERSION']}). "
                  "Update market-site/src/lib/releases.ts in the same change."
              )
          PY

          SHIP=true
          # Tags and manual runs always publish. On main pushes, skip when the
          # only matching paths were Markdown (e.g. apps/*/README.md).
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_TYPE}" == "branch" ]]; then
            BEFORE="${EVENT_BEFORE:-}"
            if [[ -n "$BEFORE" && "$BEFORE" != "0000000000000000000000000000000000000000" ]]; then
              CHANGED="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"
              if ! CHANGED="$CHANGED" python3 - <<'PY'
          import os, sys
          SHIP_FILES = {
              "scripts/package-release-assets.sh",
              "scripts/ci-package-release-assets.sh",
              "scripts/publish-release-assets.sh",
              ".github/workflows/release.yml",
              "package.json",
              "package-lock.json",
          }
          ship = False
          for path in os.environ.get("CHANGED", "").splitlines():
              path = path.strip()
              if not path or path.endswith(".md"):
                  continue
              if path.startswith("apps/") or path.startswith("packages/") or path in SHIP_FILES:
                  ship = True
                  break
          sys.exit(0 if ship else 1)
          PY
              then
                SHIP=false
                echo "No shippable app code in this push (README/docs-only under apps/packages); skipping asset refresh."
              fi
            fi
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ship=$SHIP" >> "$GITHUB_OUTPUT"

  macos-app:
    name: Build macOS Apple Silicon app
    needs: version
    if: needs.version.outputs.ship == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          rm -rf node_modules apps/*/node_modules packages/*/node_modules
          npm ci

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/macos-apple-silicon/src-tauri -> target

      - name: Build Apple Silicon app
        working-directory: apps/macos-apple-silicon
        run: npm run tauri build

      - name: Package Apple Silicon zip
        env:
          ONLY: macos-arm64
          REQUIRE_BUILT_APP: "1"
        run: bash scripts/package-release-assets.sh "${{ needs.version.outputs.version }}"

      - name: Upload Apple Silicon zip
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: dist-release/AI-Job-Search-*-macos-arm64.zip
          if-no-files-found: error

  source-clients:
    name: Package Intel and Windows clients
    needs: version
    if: needs.version.outputs.ship == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package source clients
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ONLY: macos-x64,windows-x64
        run: bash scripts/ci-package-release-assets.sh

      - name: Upload source zips
        uses: actions/upload-artifact@v4
        with:
          name: release-source
          path: dist-release/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release assets
    needs: [version, macos-app, source-clients]
    if: always() && !cancelled() && needs.version.result == 'success' && needs.version.outputs.ship == 'true' && (needs.macos-app.result == 'success' || needs.source-clients.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Apple Silicon zip
        if: needs.macos-app.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: release-macos-arm64
          path: incoming

      - name: Download Intel and Windows zips
        if: needs.source-clients.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: release-source
          path: incoming

      - name: Publish assets onto the existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          RELEASE_SHA: ${{ github.sha }}
          ARM64_REBUILT: ${{ needs.macos-app.result == 'success' }}
          SOURCE_REBUILT: ${{ needs.source-clients.result == 'success' }}
        run: bash scripts/publish-release-assets.sh incoming
