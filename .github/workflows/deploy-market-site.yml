name: Deploy market site

on:
  push:
    branches:
      - main
    paths:
      - "market-site/**"
      - "packages/core/**"
      - ".github/workflows/deploy-market-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install and export features from core
        run: |
          npm install
          npm run build:features

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: market-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
